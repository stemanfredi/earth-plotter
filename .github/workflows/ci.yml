# Test on pushes to main and on pull requests; publish main to GitHub Pages when tests pass.
# Weekly: the same tests against the live tile providers (the page depends on them) plus a
# report of newer library versions and data. Repo setting needed once: Pages → Source: GitHub Actions.
# Actions are pinned to commits (tag in the comment), the runner to its image; bump them deliberately.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']   # the site is unchanged: no tests, no deploy
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

# one run per branch at a time: a newer push cancels the older run, so an older commit never deploys
# over a newer one (the pages group below only queues). The weekly run has a group of its own, so a
# push during it neither cancels it nor replaces it while it waits (it never deploys: running beside
# a push is harmless)
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'schedule' && '-weekly' || '' }}
  cancel-in-progress: true

jobs:
  test:                              # offline: fast and deterministic
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test                # unit tests, offline (and what npm run vendor writes up to date: tools/deps.mjs)
      - run: npm run lint            # ESLint's recommended rules
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm outdated || true    # newer library versions, in the log
      - if: github.event_name == 'schedule'   # live data: never in a manual run, a redeploy an outage must not block
        run: npm run data-check      # newer density data: a notice; a layer or dataset no longer offered: a failure

  browser:                           # headless Chrome: smoke against the live providers; draw and ui without them
    runs-on: ubuntu-24.04
    timeout-minutes: 40              # smoke waits up to 10 min for an area save, and may run twice (its retry sleeps a minute), then draw and ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # the Chromium playwright-core is pinned to, not the runner's Chrome (which moves with each image)
      - run: |
          npx playwright-core install chromium
          echo "CHROME=$(node -e "import('playwright-core').then((m) => console.log(m.chromium.executablePath()))")" >> "$GITHUB_ENV"
      # smoke: one retry, a pass only on it a warning on the run (a check that fails now and then is
      # seen); what providers served counts as test/browser.mjs says (warnings on a push, strict weekly)
      - run: npm run smoke || (echo "::warning title=Retry::smoke passed only on its retry"; sleep 60; npm run smoke)
        env:
          STRICT: ${{ github.event_name == 'schedule' && '1' || '' }} # a run by hand is a redeploy: a provider's outage must not block it
      - run: npm run draw            # the drawing tools, every request but the site's own aborted: no retry
      - run: npm run ui              # no overlaps, 44 px targets, 390/820/1280 px; without the network: no retry
      - if: github.event_name == 'schedule'   # live data, weekly only (a manual run is a redeploy)
        run: npm run tiles-check     # known trouble spots: seams, zooms, lakes (live data, weekly)

  deploy:
    needs: [test, browser]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:                     # a job's own list replaces the workflow's
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      # the version shown in About: the commit published, and its date
      - run: printf '{"commit":"%s","date":"%s"}\n' "$GITHUB_SHA" "$(git log -1 --format=%cI)" > site/version.json
      # the service worker's version: the commit, so each deploy is a new worker that fetches its files
      # (a development copy keeps 'dev': the network first)
      - run: sed -i "s/^const VERSION = 'dev';/const VERSION = '$GITHUB_SHA';/" site/sw.js && grep -q "^const VERSION = '$GITHUB_SHA';" site/sw.js
      # named by the attempt: a re-run of this job uploads again, and deploy-pages refuses a run holding
      # two uploads of one name
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site                 # the site files only: no tools, tests or dev dependencies
          name: github-pages-${{ github.run_attempt }}
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346    # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
